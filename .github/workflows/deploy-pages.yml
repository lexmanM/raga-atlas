name: Deploy to GitHub Pages

# Builds the static site and publishes it to the `gh-pages` branch, which
# GitHub Pages serves at https://lexmanm.github.io/raga-atlas/.
# Nothing here is required to build or run Raga Atlas locally.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # Not `npm ci`. rolldown and @tailwindcss/oxide declare optional
        # wasm32-wasi bindings whose own dependencies npm only expands when
        # the lock file is generated on Linux, so `npm ci` rejects a lock
        # file that is in fact correct. Every direct dependency is pinned to
        # an exact version, so the build stays reproducible.
        run: npm install --no-audit --no-fund

      - name: Build
        env:
          BASE_PATH: /raga-atlas/
        run: npm run build

      - name: Publish to the gh-pages branch
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          # Pages serves the directory as-is, without Jekyll preprocessing.
          touch dist/.nojekyll
          # Single document app: unknown paths fall back to the same page.
          cp dist/index.html dist/404.html

          # Publish from a separate worktree rather than switching branches in
          # place: the source checkout is dirty after npm install, and gh-pages
          # carries no .gitignore, so `git add -A` there would swallow
          # node_modules.
          git fetch origin gh-pages
          git worktree add -B gh-pages "${RUNNER_TEMP}/pages" origin/gh-pages
          git -C "${RUNNER_TEMP}/pages" rm -rq . --ignore-unmatch
          cp -R dist/. "${RUNNER_TEMP}/pages/"
          git -C "${RUNNER_TEMP}/pages" add -A
          if git -C "${RUNNER_TEMP}/pages" diff --cached --quiet; then
            echo "Site output is unchanged; nothing to publish."
            exit 0
          fi
          git -C "${RUNNER_TEMP}/pages" commit -m "Publish site from ${GITHUB_SHA}"
          git -C "${RUNNER_TEMP}/pages" push origin gh-pages
