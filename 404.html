    <script>
      // Set the theme before first paint so a returning reader never sees the wrong palette flash.
      (function () {
        var theme;
        try { theme = localStorage.getItem('ragas.theme'); } catch (e) {}
        if (theme !== 'night' && theme !== 'paper' && theme !== 'peacock') {
          theme = matchMedia('(prefers-color-scheme: light)').matches ? 'paper' : 'night';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
