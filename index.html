<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A focused Carnatic Rāga Atlas for exploring melakarta and janya ragas."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Rāga Atlas — Carnatic raga reference</title>
    <script>
      // Set the theme before first paint so a returning reader never sees the wrong palette flash.
      (function () {
        var theme;
        try { theme = localStorage.getItem('ragas.theme'); } catch (e) {}
        if (theme !== 'night' && theme !== 'paper' && theme !== 'peacock') {
          theme = matchMedia('(prefers-color-scheme: light)').matches ? 'paper' : 'night';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
