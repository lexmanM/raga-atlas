[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "swara-practice"
version = "0.1.0"
description = "Local-first Carnatic vocal practice archive"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
analysis = [
  "librosa>=0.11,<1",
  "numpy>=2,<3",
  "pyloudnorm>=0.1.1,<1",
  "soundfile>=0.13,<1",
]
dev = ["pytest>=8,<9"]

[project.scripts]
swara = "swara.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/swara"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
